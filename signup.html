<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="parent" >
      <div class="formContainer">
        <h1>LET'S GET STARTED</h1>
        <p>
          Create an account to get recommended jobs that match your resume and
          apply to multiple jobs in seconds!
        </p>

        <div class="form">
          <input type="text" placeholder="User Name" />

          <div class="inputGroup">
            <input type="text" placeholder="First Name" />
            <input type="text" class="lastName" placeholder="last Name" />
          </div>

          <input type="text" placeholder="Email Address" />

          <div class="inputGroup">
            <input type="password" placeholder="Password" />
            <input type="password" placeholder="Confirm Password" />
          </div>

          <p class="agreePara">
            By clicking Agree & Join, you agree to the User Agreement, Privacy
            Policy, and Cookie Policy.
          </p>

          <button class="signUpBtn">Agree & Join</button>
          <p class="loginText">Already on Hiring Mine? <a href="./login.html">Login</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
